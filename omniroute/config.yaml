arch:
  - aarch64
  - amd64
description:
  Open-source AI inference gateway and router (OpenAI-compatible drop-in
  replacement)
image: ghcr.io/alexbelgium/omniroute-{arch}
ingress: true
init: false
map:
  - app_config:rw
name: OmniRoute
options:
  env_vars: []
  REQUIRE_API_KEY: true
  OMNIROUTE_MEMORY_MB: 1024
panel_icon: mdi:router-network
ports:
  20128/tcp: null
ports_description:
  20128/tcp: OmniRoute Web UI and OpenAI API gateway (opt-in)
schema:
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str?
  INITIAL_PASSWORD: password?
  REQUIRE_API_KEY: bool
  OMNIROUTE_MEMORY_MB: int
  TZ: str?
slug: omniroute
url: https://github.com/alexbelgium/hassio-addons/tree/master/omniroute
version: "3.8.52"
