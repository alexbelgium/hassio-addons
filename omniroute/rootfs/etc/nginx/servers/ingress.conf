server {
    listen %%interface%%:%%port%% default_server;

    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:20129;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_connect_timeout 30m;
        proxy_send_timeout 30m;
        proxy_read_timeout 30m;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; frame-ancestors 'self'; object-src 'none'" always;

        absolute_redirect off;
        proxy_redirect http://127.0.0.1:20129/ %%ingress_entry%%/;
        proxy_redirect / %%ingress_entry%%/;

        proxy_cookie_path / %%ingress_entry%%/;

        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript text/css application/json;
        sub_filter '"/_next/' '"%%ingress_entry%%/_next/';
        sub_filter "'/_next/" "'%%ingress_entry%%/_next/";
        sub_filter 'url(/_next/' 'url(%%ingress_entry%%/_next/';
        sub_filter '`/_next/' '`%%ingress_entry%%/_next/';
        sub_filter '"/api/' '"%%ingress_entry%%/api/';
        sub_filter "'/api/" "'%%ingress_entry%%/api/";
        sub_filter '`/api/' '`%%ingress_entry%%/api/';
        sub_filter '"/favicon.ico"' '"%%ingress_entry%%/favicon.ico"';
        sub_filter '"/icons/' '"%%ingress_entry%%/icons/';
        sub_filter "'/icons/" "'%%ingress_entry%%/icons/";

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }
}

server {
    listen 20128 default_server;

    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:20129;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_connect_timeout 30m;
        proxy_send_timeout 30m;
        proxy_read_timeout 30m;
    }
}
