server {
    listen %%interface%%:%%port%% default_server;
    listen 20128 default_server;

    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_buffering off;
    proxy_read_timeout 30m;
    proxy_send_timeout 30m;

    # Upstream Next.js routes compile X-Frame-Options: DENY and frame-ancestors 'none',
    # which blocks the Home Assistant Ingress iframe. Allow embedding in the HA panel.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; frame-ancestors 'self'; object-src 'none'" always;

    location = / {
        proxy_pass http://127.0.0.1:20129%%ingress_entry%%;
    }

    location %%ingress_entry%% {
        proxy_pass http://127.0.0.1:20129;
    }

    location / {
        proxy_pass http://127.0.0.1:20129%%ingress_entry%%/;
    }
}
