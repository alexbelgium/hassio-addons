server {
    listen %%interface%%:%%port%% default_server;
    include /etc/nginx/includes/server_params.conf;
    include /etc/nginx/includes/proxy_params.conf;
    client_max_body_size 0;
    server_name guacamole.*;

    location / {
       add_header Access-Control-Allow-Origin *;
       proxy_pass http://127.0.0.1:8080;
       proxy_buffering off;
       proxy_read_timeout 30;
       proxy_set_header Connection "Upgrade";
       proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Host $host;
       proxy_set_header REMOTE_USER %%ingress_user%%;

       # The HA sidebar panel loads Guacamole in an iframe without focusing it, so keys
       # go to HA's own shortcuts until the user clicks inside (#3274). Focus the frame
       # on load and again whenever Guacamole changes view (opening a connection, also
       # an automatic one, changes the #/client/... hash), since focusing only at load
       # still left one Tab press needed (#3285). frameElement is null outside an iframe.
       # Also focus on every mousedown (capture phase): Guacamole cancels mousedown on the
       # remote display, so a click there never moves focus into the frame by itself,
       # and keys typed afterwards still went to HA, whose shortcuts (e, a, c...) then
       # open dialogs over the panel (#3285).
       proxy_set_header Accept-Encoding "";
       sub_filter '</body>' '<script>(function(){function f(){if(window.frameElement)window.frameElement.focus();window.focus()}window.addEventListener("load",f);window.addEventListener("hashchange",f);window.addEventListener("mousedown",f,true)})()</script></body>';
    }
}

