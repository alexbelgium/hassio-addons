server {
    listen %%interface%%:%%port%% default_server;
    include /etc/nginx/includes/server_params.conf;
    include /etc/nginx/includes/proxy_params.conf;
    client_max_body_size 0;
    server_name guacamole.*;

    location / {
       add_header Access-Control-Allow-Origin *;
       proxy_pass http://127.0.0.1:8080;
       proxy_buffering off;
       proxy_read_timeout 30;
       proxy_set_header Connection "Upgrade";
       proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Host $host;
       proxy_set_header REMOTE_USER %%ingress_user%%;

       # The HA sidebar panel loads Guacamole in an iframe without focusing it, so keys
       # go to HA's own shortcuts until the user clicks inside (#3274). Focus the frame
       # once on load; Guacamole's keyboard handler then receives keys from the start.
       proxy_set_header Accept-Encoding "";
       sub_filter '</body>' '<script>window.addEventListener("load",function(){window.focus()})</script></body>';
    }
}

