server {

    listen 80;
    root /home/wger;

    # /ps/ -> the bundled PowerSync service, used by the mobile app for offline sync.
    # Written by 89-powersync-run.sh only when the POWERSYNC_ENABLED option is set, so with
    # the feature off this glob matches nothing and the served config is unchanged.
    include /etc/nginx/ps/*.conf;

    location / {
        proxy_pass http://127.0.0.1:8000;
        add_header Access-Control-Allow-Origin *;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    location /static/ {
        root /home/wger;
        try_files $uri /src/wger/core$uri /mnt$uri /src/wger/software$uri =404;
    }

    location /media/ {
        root /home/wger;
    }

    # Increase max body size to allow for video uploads
    client_max_body_size 100M;

}
