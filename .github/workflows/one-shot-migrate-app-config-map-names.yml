---
name: One-shot app config map migration

on:
  push:
    branches:
      - agent/migrate-app-config-map-names

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v7.0.1
        with:
          ref: agent/migrate-app-config-map-names
          fetch-depth: 0

      - name: Replace legacy map names atomically
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t config_files < <(
            git grep -Il 'addon_config' -- '*/config.yaml' '*/config.yml' '*/config.json' || true
          )

          if [ "${#config_files[@]}" -eq 0 ]; then
            echo "No add-on manifests use addon_config"
            exit 1
          fi

          printf 'Affected manifests (%s):\n' "${#config_files[@]}"
          printf '  %s\n' "${config_files[@]}"

          declare -A addon_dirs=()
          for config_file in "${config_files[@]}"; do
            addon_dirs["${config_file%%/*}"]=1
          done

          changelog_entry='- Migrate deprecated Home Assistant map names to their app equivalents.'
          for addon_dir in "${!addon_dirs[@]}"; do
            changelog="${addon_dir}/CHANGELOG.md"
            if [ ! -f "$changelog" ]; then
              echo "Missing required changelog: $changelog"
              exit 1
            fi

            CHANGELOG="$changelog" ENTRY="$changelog_entry" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["CHANGELOG"])
          entry = os.environ["ENTRY"]
          text = path.read_text(encoding="utf-8")
          if entry in text:
              raise SystemExit

          lines = text.splitlines(keepends=True)
          heading = next((index for index, line in enumerate(lines) if line.startswith("## ")), None)
          if heading is None:
              text = f"## 2026.08.02 (2026-08-02)\n\n{entry}\n\n{text}"
          else:
              insert_at = heading + 1
              while insert_at < len(lines) and not lines[insert_at].strip():
                  insert_at += 1
              lines.insert(insert_at, entry + "\n")
              text = "".join(lines)
          path.write_text(text, encoding="utf-8")
          PY
          done

          mapfile -t legacy_files < <(git grep -Il 'addon_config' || true)
          if [ "${#legacy_files[@]}" -eq 0 ]; then
            echo "No tracked files use addon_config"
            exit 1
          fi

          printf 'Replacing legacy names in %s tracked text files\n' "${#legacy_files[@]}"
          perl -pi -e 's/addon_config/app_config/g' "${legacy_files[@]}"

          rm -- .github/workflows/one-shot-migrate-app-config-map-names.yml

          if git grep -n 'addon_config'; then
            echo "Legacy addon_config references remain"
            exit 1
          fi

          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate app config map names'
          git push origin HEAD:agent/migrate-app-config-map-names
