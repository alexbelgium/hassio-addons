# yamllint disable rule:line-length
# shellcheck disable=SC2043
---
name: PR Check Build

on:
  pull_request:
    branches:
      - master

# Fork PRs run untrusted code here (the Dockerfile itself): keep the token read-only.
permissions:
  contents: read

jobs:
  # 1. Detect which add-on folders changed (by config.json|yaml|yml modification)
  check-addon-changes:
    if: ${{ github.repository_owner == 'alexbelgium' }}
    runs-on: ubuntu-latest
    outputs:
      changedAddons: ${{ steps.find_addons.outputs.changed_addons }}
      changedChangelogFiles: ${{ steps.changed-files.outputs.changelogs_files }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the merge commit's parents resolvable (HEAD^1 below): a depth-1 shallow
          # checkout truncates parent refs entirely at the boundary commit.
          fetch-depth: 2
          persist-credentials: false
      - name: Find changed addon directories
        id: find_addons
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # github.event.pull_request.base.sha is a snapshot from event-trigger time and can be
          # stale if master advances before checkout; HEAD^1 is the actual base this merge
          # commit was built against, so it's always correct.
          base_sha=$(git rev-parse HEAD^1)
          git fetch origin "$base_sha"
          diff_files=$(git diff --name-only "$base_sha" "$HEAD_SHA")
          changed_config_files=$(printf '%s\n' "$diff_files" | grep -E '^[^/]+/config\.(json|ya?ml)$' || true)
          echo "Changed config files:"
          echo "$changed_config_files"
          # Directory names end up in a job matrix and in shell: accept plain names only.
          changed_addons=$(printf '%s' "$changed_config_files" | awk -F/ '{print $1}' | sort -u \
            | { grep -E '^[A-Za-z0-9._-]+$' || true; } | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Changed addons: $changed_addons"
          echo "changed_addons=$changed_addons" >> "$GITHUB_OUTPUT"
      - name: Find changelog
        id: changed-files
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse HEAD^1)
          diff_files=$(git diff --name-only "$base_sha" "$HEAD_SHA")
          changed_changelog_files=$(printf '%s\n' "$diff_files" | grep -iE '^([^/]+/)?changelog\.(md|txt|ya?ml|json)$' || true)
          echo "$changed_changelog_files"
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "changelogs_files<<${delimiter}"
            echo "$changed_changelog_files"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

  check-changed-changelog:
    name: Check if CHANGELOG.md changed
    needs: check-addon-changes
    if: ${{ needs.check-addon-changes.outputs.changedAddons != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.check-addon-changes.outputs.changedAddons) }}
    steps:
      - name: 🔎 Check for updated CHANGELOG.md
        shell: bash
        env:
          ADDON: ${{ matrix.addon }}
          CHANGELOG_FILES: ${{ needs.check-addon-changes.outputs.changedChangelogFiles }}
        run: |
          if ! grep -qxF -- "${ADDON}/CHANGELOG.md" <<<"$CHANGELOG_FILES"; then
            echo "::error::No new entries in ${ADDON} CHANGELOG.md file!"
            exit 1
          fi

  addon-linter:
    name: Addon linting
    needs: check-addon-changes
    if: ${{ needs.check-addon-changes.outputs.changedAddons != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.check-addon-changes.outputs.changedAddons) }}
    steps:
      - name: ↩️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Run Home Assistant Add-on Lint
        uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2
        with:
          path: "./${{ matrix.addon }}"

  check-build:
    name: Test addon build
    needs: check-addon-changes
    if: ${{ needs.check-addon-changes.outputs.changedAddons != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.check-addon-changes.outputs.changedAddons) }}
    steps:
      - name: ↩️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve symlinks in repository copy
        run: bash .github/scripts/resolve_symlinks.sh

      - name: Copy templates into addon build context
        env:
          ADDON: ${{ matrix.addon }}
        run: |
          set -euo pipefail
          TEMPLATES_DIR=".templates"
          ADDON_DIR="./$ADDON"

          # Keep PR builds aligned with the production builder.
          for script in ha_automodules.sh ha_autoapps.sh ha_entrypoint.sh bashio-standalone.sh ha_lsio.sh; do
            if [ -f "$TEMPLATES_DIR/$script" ]; then
              cp "$TEMPLATES_DIR/$script" "$ADDON_DIR/$script"
            fi
          done

      - name: ℹ️ Gather addon info
        id: information
        shell: bash
        env:
          ADDON: ${{ matrix.addon }}
        run: |
          set -euo pipefail
          # Same rules as onpush_builder.yaml: the build file is optional, and the
          # architectures are the build_from keys, else the config "arch" list.
          first() { for n in "$@"; do [ -f "$ADDON/$n" ] && { echo "$ADDON/$n"; return; }; done; return 0; }
          config_file="$(first config.json config.yaml config.yml)"
          [ -n "$config_file" ] || { echo "No config file found in $ADDON" >&2; exit 1; }
          build_file="$(first build.json build.yaml build.yml)"
          config="$(yq -o=json '.' "$config_file")"
          build='{}'
          [ -z "$build_file" ] || build="$(yq -o=json '.' "$build_file")"
          archs="$(jq -n --argjson c "$config" --argjson b "$build" \
            '(($b.build_from // {}) | keys) as $k | if ($k | length) > 0 then $k else ($c.arch // []) end')"

          # Fork-controlled values: keep single-line ones on one line.
          image="$(jq -r '.image // ""' <<<"$config")"
          version="$(jq -r '.version // "" | tostring' <<<"$config")"
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "image=${image//[$'\r\n']/}"
            echo "version=${version//[$'\r\n']/}"
            echo "build=$build_file"
            for arch in aarch64 amd64; do
              echo "${arch}=$(jq -r --arg a "$arch" 'index($a) != null' <<<"$archs")"
            done
            for key in name description; do
              echo "${key}<<${delimiter}"
              jq -r --arg k "$key" '.[$k] // "" | tostring' <<<"$config"
              echo "${delimiter}"
            done
          } >> "$GITHUB_OUTPUT"

      - name: 🗄️ Cache docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.addon }}-${{ hashFiles('**/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.addon }}-

      # Only the two architectures the production builder publishes (onpush_builder.yaml).
      # Values read from the PR's config files go through the environment, never into the
      # script text.
      - name: 🔖 Create image tags, labels and build-args
        id: meta
        shell: bash
        env:
          ADDON: ${{ matrix.addon }}
          IMAGE_TEMPLATE: ${{ steps.information.outputs.image }}
          VERSION: ${{ steps.information.outputs.version }}
          NAME: ${{ steps.information.outputs.name }}
          DESCRIPTION: ${{ steps.information.outputs.description }}
          BUILD_FILE: ${{ steps.information.outputs.build }}
        run: |
          set -euo pipefail
          # Labels are one per line: keep each value on a single line.
          NAME=${NAME//[$'\r\n']/ }
          DESCRIPTION=${DESCRIPTION//[$'\r\n']/ }

          build_json='{}'
          if [ -n "$BUILD_FILE" ] && [ -f "$BUILD_FILE" ]; then
            case "$BUILD_FILE" in
              *.yaml|*.yml) build_json="$(yq -o=json '.' "$BUILD_FILE")" ;;
              *)            build_json="$(cat "$BUILD_FILE")" ;;
            esac
          fi

          delimiter="EOF_$(openssl rand -hex 16)"
          for arch in aarch64 amd64; do
            {
              echo "${arch}_tags=${IMAGE_TEMPLATE/\{arch\}/$arch}:${VERSION}"
              echo "${arch}_build_args=BUILD_FROM=$(jq -r --arg a "$arch" '.build_from[$a] // empty' <<<"$build_json")"
              echo "${arch}_labels<<${delimiter}"
              echo "io.hass.version=${VERSION}"
              echo "io.hass.name=${NAME}"
              echo "io.hass.description=${DESCRIPTION}"
              echo "io.hass.type=addon"
              echo "io.hass.arch=${arch}"
              echo "io.hass.url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/master/${ADDON}"
              echo "org.opencontainers.image.title=${NAME}"
              echo "org.opencontainers.image.description=${DESCRIPTION}"
              echo "org.opencontainers.image.version=${VERSION}"
              echo "org.opencontainers.image.authors=alexbelgium (https://github.com/alexbelgium)"
              echo "org.opencontainers.image.url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
              echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/master/${ADDON}"
              echo "org.opencontainers.image.created=$(date -Is)"
              echo "org.opencontainers.image.revision=${GITHUB_SHA}"
              echo "${delimiter}"
            } >> "$GITHUB_OUTPUT"
          done

      - name: 🏗️ Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: 💿 Build Addon - aarch64
        if: ${{ steps.information.outputs.aarch64 == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.addon }}
          platforms: linux/arm64
          push: false
          load: true
          file: ${{ matrix.addon }}/Dockerfile
          tags: ${{ steps.meta.outputs.aarch64_tags }}
          labels: ${{ steps.meta.outputs.aarch64_labels }}
          build-args: ${{ steps.meta.outputs.aarch64_build_args }}
          cache-from: type=local,src=/tmp/buildx-cache/aarch64
          cache-to: type=local,dest=/tmp/buildx-cache-new/aarch64

      - name: 💿 Build Addon - amd64
        if: ${{ steps.information.outputs.amd64 == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.addon }}
          push: false
          load: true
          file: ${{ matrix.addon }}/Dockerfile
          tags: ${{ steps.meta.outputs.amd64_tags }}
          labels: ${{ steps.meta.outputs.amd64_labels }}
          build-args: ${{ steps.meta.outputs.amd64_build_args }}
          cache-from: type=local,src=/tmp/buildx-cache/amd64
          cache-to: type=local,dest=/tmp/buildx-cache-new/amd64

      - name: 🗄️ Update cache Folder
        run: |
          rm -rf /tmp/buildx-cache
          if [ -d /tmp/buildx-cache-new ]; then
            mv /tmp/buildx-cache-new /tmp/buildx-cache
          fi
