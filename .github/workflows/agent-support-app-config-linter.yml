---
name: Prepare app_config linter compatibility

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Switch repository workflows to compatibility action
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacement = "uses: ./.github/actions/addon-linter"
          for filename in (
              ".github/workflows/onpr_check-pr.yaml",
              ".github/workflows/onpush_builder.yaml",
          ):
              path = Path(filename)
              content = path.read_text(encoding="utf-8")
              needle = "uses: frenck/action-addon-linter@v2"
              count = content.count(needle)
              if count != 1:
                  raise SystemExit(f"Expected one {needle!r} in {filename}, found {count}")
              path.write_text(content.replace(needle, replacement), encoding="utf-8")
          PY

      - name: Run normalizer unit tests
        run: python3 .github/scripts/test_prepare_addon_lint_config.py

      - name: Create current-schema linter fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-addon-linter-fixture
          cat > .tmp-addon-linter-fixture/config.yaml <<'FIXTURE'
          ---
          name: App Config Compatibility Fixture
          version: "1.0.0"
          slug: app_config_fixture
          description: Validates current Home Assistant app configuration map names
          arch:
            - amd64
          map:
            - app_config:rw
            - all_app_configs:ro
            - type: app_config
              read_only: false
          FIXTURE

      - name: Verify current map names through upstream linter
        uses: ./.github/actions/addon-linter
        with:
          path: ./.tmp-addon-linter-fixture

      - name: Commit compatibility implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-addon-linter-fixture .addon-lint
          rm .github/workflows/agent-support-app-config-linter.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/onpr_check-pr.yaml \
            .github/workflows/onpush_builder.yaml \
            .github/workflows/agent-support-app-config-linter.yml
          git diff --cached --check
          git commit -m "Use app_config-compatible add-on linter"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
