arch:
  - aarch64
  - amd64
backup: cold
description: Postgres 17 with VectorChord support, upgrades older databases automatically
environment:
  CONFIG_LOCATION: /config/postgresql.conf
  PGDATA: /config/database
hassio_api: true
hassio_role: manager
homeassistant_api: true
image: ghcr.io/alexbelgium/postgres_17-{arch}
init: false
map:
  - app_config:rw
  - homeassistant_config:rw
  - media:rw
name: Postgres 17
options:
  env_vars: []
  POSTGRES_PASSWORD: homeassistant
ports:
  5432/tcp: 5432
ports_description:
  5432/tcp: Postgres
schema:
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str?
  POSTGRES_DB: str?
  POSTGRES_HOST_AUTH_METHOD: str?
  POSTGRES_INITDB_ARGS: str?
  POSTGRES_PASSWORD: password
  POSTGRES_USER: str?
slug: postgres_latest
startup: system
udev: true
url: https://github.com/alexbelgium/hassio-addons/tree/master/postgres_17
version: "17.10.0"
