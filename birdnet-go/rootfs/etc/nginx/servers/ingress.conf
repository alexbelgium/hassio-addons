server {
    listen %%interface%%:%%port%% default_server;
    include /etc/nginx/includes/server_params.conf;
    include /etc/nginx/includes/proxy_params.conf;

    location / {
      # Only the Supervisor's ingress proxy may use this server.
      allow   172.30.32.2;
      deny    all;

      proxy_pass http://127.0.0.1:8080/;
      rewrite ^%%ingress_entry%%/?(.*)$ /$1 break;

      # Disable buffering (required for SSE)
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;

      # WebSocket support
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      # The Supervisor (the only allowed peer) is the client BirdNET-Go sees.
      # Overwrite every client-IP header so they agree: otherwise headers
      # passed through Home Assistant (CF-Connecting-IP, Forwarded, ...)
      # make Settings > Security > Reverse proxy report "Proxy headers
      # cannot be verified" and the subnet bypass never applies.
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Forwarded "";
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header True-Client-IP "";
      proxy_set_header X-Forwarded-Proto $scheme;

      # Tell BirdNET-Go its proxy prefix. Upstream honours X-Ingress-Path
      # and adds the prefix itself (HTML, JS/CSS assets and frontend URLs),
      # so the response bodies must not be rewritten here: rewriting the
      # '/ui/...' strings in the JS broke the System sub-tabs.
      proxy_set_header X-Ingress-Path %%ingress_entry%%;

      # Prevent timeouts
      proxy_read_timeout 86400;
      proxy_send_timeout 86400;

      # Keep upstream responses uncompressed, as before
      proxy_set_header Accept-Encoding "";
    }
}
