server {
    listen %%interface%%:%%port%% default_server;
    listen 4500 default_server;

    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # Ingress status mapping
    location = / {
        proxy_pass http://127.0.0.1:4501/readyz;
    }

    location = %%ingress_entry%% {
        proxy_pass http://127.0.0.1:4501/readyz;
    }

    location = %%ingress_entry%%/ {
        proxy_pass http://127.0.0.1:4501/readyz;
    }

    # Ingress-prefixed routes
    location %%ingress_entry%%/ws {
        proxy_pass http://127.0.0.1:4501/ws;
    }

    location %%ingress_entry%%/v1/ {
        proxy_pass http://127.0.0.1:4501/v1/;
    }

    location %%ingress_entry%%/readyz {
        proxy_pass http://127.0.0.1:4501/readyz;
    }

    location %%ingress_entry%%/healthz {
        proxy_pass http://127.0.0.1:4501/healthz;
    }

    location %%ingress_entry%%/app-server-info {
        proxy_pass http://127.0.0.1:4501/app-server-info;
    }

    # Direct routes
    location /ws/ {
        proxy_pass http://127.0.0.1:4501/ws/;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:4501/ws;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:4501/readyz;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:4501/healthz;
    }

    location = /app-server-info {
        proxy_pass http://127.0.0.1:4501/app-server-info;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:4501/v1/;
    }
}
