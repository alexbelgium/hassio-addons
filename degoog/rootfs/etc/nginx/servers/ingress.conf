server {
    # Ingress, and the direct port. Both are served the same way : Degoog runs
    # with its base path set to the ingress entry (services.d/degoog/run), and
    # Home Assistant strips that entry before forwarding, so it is put back here.
    listen %%interface%%:%%port%% default_server;
    listen 4444 default_server;

    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Search results are sent to the page as server-sent events
    proxy_buffering off;
    proxy_read_timeout 30m;
    proxy_send_timeout 30m;

    # The one url upstream builds without its base path
    # (src/server/routes/pages/render.tsx)
    proxy_set_header Accept-Encoding "";
    sub_filter 'src="/public/t.js' 'src="%%ingress_entry%%/public/t.js';

    # Degoog answers <entry>/ with a redirect to the slashless <entry>, which
    # Home Assistant does not route : ask for the slashless form directly.
    location = / {
        proxy_pass http://127.0.0.1:4445%%ingress_entry%%;
    }

    # Links in the pages already carry the entry ; only the direct port sees
    # them, since ingress strips it. No trailing slash, so the bare entry
    # (the target of Degoog's own trailing-slash redirect) matches too.
    location %%ingress_entry%% {
        proxy_pass http://127.0.0.1:4445;
    }

    # Transport websockets are the only routes upstream mounts outside its base
    # path (src/server/index.ts)
    location /ws/ {
        proxy_pass http://127.0.0.1:4445;
    }

    location / {
        proxy_pass http://127.0.0.1:4445%%ingress_entry%%/;
    }
}
